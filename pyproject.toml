[project]
name = "arbitrage-finder"
version = "0.1.0"
description = "A private, manual pre-match arbitrage workbench with transparent data provenance"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "beautifulsoup4>=4.13,<5", "cryptography>=44,<47",
]

[project.optional-dependencies]
browser = ["playwright>=1.51,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]
docs = ["reportlab>=4.4,<5"]

[project.scripts]
arbscanner = "arbscanner.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arbscanner"]

[tool.hatch.build.targets.wheel.force-include]
"static" = "arbscanner/static"
"docs/pdf" = "arbscanner/documents"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
